<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETNOSATEK · 3 Bagian + Corak</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== OKLCH PALET ===== */
        :root {
            --biru-teknologi: oklch(0.35 0.12 240); 
            --krem-nusantara: oklch(0.92 0.06 80);
            --emas-aksen: oklch(0.75 0.15 85);
            --putih-beras: oklch(0.99 0.01 80);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Nunito', sans-serif;
            /* Background Putih + Garis Biru & Kuning Bercorak (Seperti permintaan Anda) */
            background-color: var(--putih-beras);
            background-image: 
                /* Garis biru halus diagonal */
                linear-gradient(45deg, var(--biru-teknologi) 1px, transparent 1px),
                /* Garis kuning halus diagonal */
                linear-gradient(-45deg, var(--emas-aksen) 1px, transparent 1px);
            background-size: 40px 40px, 60px 60px; /* Ukuran pola kotak */
            background-opacity: 0.05; /* Sangat tipis agar tidak mengganggu gambar */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        /* ===== KONTAINER WEBSITE ===== */
        .container-website {
            width: 100%;
            max-width: 1200px;
            background: var(--putih-beras);
            border-radius: 32px;
            box-shadow: 0 20px 60px oklch(0 0 0 / 0.08);
            overflow: hidden;
            position: relative;
            border: 1px solid oklch(0 0 0 / 0.05);
        }

        /* ===== FLOATING HAMBURGER ===== */
        .floating-header {
            position: fixed;
            top: 20px; right: 20px; z-index: 999;
            display: flex; flex-direction: column; align-items: flex-end;
        }
        .hamburger {
            background: var(--biru-teknologi);
            border: none; width: 50px; height: 50px; border-radius: 50%;
            color: var(--emas-aksen); font-size: 1.4rem; cursor: pointer;
            box-shadow: 0 4px 16px oklch(0 0 0 / 0.2);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; justify-content: center; align-items: center;
        }
        .hamburger:hover { transform: scale(1.1); }
        .nav-dropdown {
            margin-top: 10px; background: var(--putih-beras);
            border-radius: 16px; padding: 12px 0; min-width: 160px;
            box-shadow: 0 8px 30px oklch(0 0 0 / 0.15);
            opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: all 0.3s ease; border: 1px solid oklch(0.8 0.02 80);
        }
        .nav-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .nav-dropdown button {
            display: block; width: 100%; background: transparent; border: none;
            color: var(--biru-teknologi); padding: 10px 20px; font-family: inherit;
            font-weight: 700; font-size: 0.9rem; cursor: pointer; text-align: left;
            transition: background 0.2s;
        }
        .nav-dropdown button:hover { background: var(--krem-nusantara); color: var(--emas-aksen); }
        .nav-dropdown button i { margin-right: 10px; width: 20px; }

        /* ===== HEADER (page1.png) & FOOTER (page3.png) ===== */
        .img-section {
            width: 100%; display: block; line-height: 0;
        }
        .img-section img {
            width: 100%; height: auto; display: block; object-fit: cover;
        }

        /* ===== BODY BARU (page2.png) ===== */
        /* Ini adalah bagian tengah dengan jarak 3cm dari header */
        .body-section {
            width: 100%;
            /* JARAK 3 CM SESUAI PERMINTAAN ANDA! */
            margin-top: 3cm;
            margin-bottom: 3cm;
            display: block;
            line-height: 0;
            padding: 0;
        }
        .body-section img {
            width: 100%; height: auto; display: block;
        }

        /* ===== HALAMAN LAIN ===== */
        .halaman { display: none; padding: 40px; text-align: center; }
        .halaman.active { display: block; }
        .hero-other h2 { font-size: 2.5rem; color: var(--biru-teknologi); margin-bottom: 16px; }
        .hero-other p { font-size: 1.1rem; color: var(--biru-teknologi); line-height: 1.8; }
        .btn-spring {
            display: inline-block; margin-top: 20px; background: var(--emas-aksen);
            color: var(--putih-beras); padding: 12px 32px; border-radius: 40px;
            text-decoration: none; font-weight: 800; font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-spring:hover { transform: scale(1.05); }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .container-website { border-radius: 16px; }
            .floating-header { top: 10px; right: 10px; }
            .hamburger { width: 44px; height: 44px; font-size: 1.2rem; }
            .nav-dropdown { right: 0; min-width: 140px; }
            .halaman { padding: 20px; }
            .hero-other h2 { font-size: 1.8rem; }
            .body-section { margin-top: 1.5cm; margin-bottom: 1.5cm; } /* Di HP jarak dikit diperkecil */
        }
    </style>
</head>
<body>

    <!-- ===== FLOATING HAMBURGER ===== -->
    <header class="floating-header">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <nav class="nav-dropdown" id="navDropdown">
            <button data-target="home"><i class="fas fa-home"></i> Home page</button>
            <button data-target="profile"><i class="fas fa-user"></i> Profile</button>
            <button data-target="howtoplay"><i class="fas fa-gamepad"></i> Cara main!</button>
        </nav>
    </header>

    <!-- ===== KONTAINER UTAMA ===== -->
    <div class="container-website">

        <!-- HEADER (page1.png) -->
        <section class="img-section header">
            <img src="page1.png" alt="Header ETNOSATEK" />
        </section>

        <!-- BODY BARU (page2.png) - Dengan Jarak 3cm dari Header -->
        <section class="body-section">
            <img src="page2.png" alt="Body Konten ETNOSATEK" />
        </section>

        <!-- FOOTER (page3.png) -->
        <section class="img-section footer">
            <img src="page3.png" alt="Footer Pemandangan ETNOSATEK" />
        </section>

        <!-- ===== HALAMAN LAIN ===== -->
        <div id="profile" class="halaman hero-other">
            <h2>Profil Pembuat</h2>
            <p><strong>Nazwa Ananda Devina</strong><br>SMP Muhammadiyah 17 Ciputat · LKIP 2026</p>
        </div>
        <div id="howtoplay" class="halaman hero-other">
            <h2>Cara Main ETNOSATEK</h2>
            <p>Klik tombol "Mulai Petualangan" untuk memulai misi!</p>
            <a class="btn-spring" href="https://etnosatek-nazwa.vercel.app" target="_blank">Mulai Sekarang →</a>
        </div>

    </div>

    <script>
        const btn = document.getElementById('hamburgerBtn');
        const menu = document.getElementById('navDropdown');
        btn.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('open'); });
        
        const menuButtons = document.querySelectorAll('.nav-dropdown button');
        const pages = document.querySelectorAll('.halaman');
        const imageSections = document.querySelectorAll('.img-section, .body-section');

        menuButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                imageSections.forEach(el => el.style.display = 'none');
                pages.forEach(page => page.classList.toggle('active', page.id === targetId));
                menu.classList.remove('open');
            });
        });
        document.addEventListener('click', (e) => {
            if (!btn.contains(e.target) && !menu.contains(e.target)) menu.classList.remove('open');
        });
    </script>
</body>
</html>
