<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETNOSATEK · Final PNG</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== OKLCH PALET ===== */
        :root {
            --biru-base: oklch(0.45 0.12 240); 
            --krem-base: oklch(0.88 0.08 80);  
            --putih-base: oklch(1 0 0);        

            --border-hitam-tipis: oklch(0 0 0 / 0.2);
            --border-kuning: oklch(0.78 0.18 85);
            --border-krem: oklch(0.92 0.06 80);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 16px;

            /* ===== BACKGROUND FLAT 60/25/15 ===== */
            background-color: var(--putih-base);
            background-image: 
                radial-gradient(ellipse at 15% 85%, var(--biru-base) 0%, var(--biru-base) 50%, transparent 70%),
                radial-gradient(ellipse at 85% 15%, var(--krem-base) 0%, var(--krem-base) 35%, transparent 55%);
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        /* ===== KONTAINER UTAMA ===== */
        .container-website {
            width: 100%;
            max-width: 900px;
            padding: 20px 20px 0 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== FLOATING HAMBURGER ===== */
        .floating-header {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }
        .hamburger {
            background: var(--putih-base);
            border: 1px solid oklch(0 0 0 / 0.1);
            box-shadow: 0 4px 12px oklch(0 0 0 / 0.08);
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: oklch(0.2 0.05 260);
            font-size: 1.4rem;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .hamburger:hover { transform: scale(1.1); }

        /* ===== MENU DROPDOWN ===== */
        .nav-dropdown {
            position: absolute;
            top: 58px;
            right: 0;
            background: var(--putih-base);
            border-radius: 14px;
            padding: 10px 0;
            min-width: 160px;
            box-shadow: 0 8px 30px oklch(0 0 0 / 0.12);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.3s ease;
            border: 1px solid oklch(0.8 0.02 80);
        }
        .nav-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .nav-dropdown button {
            display: block; width: 100%; background: transparent; border: none;
            padding: 12px 20px; font-family: inherit; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; text-align: left; color: oklch(0.2 0.05 260);
            transition: background 0.2s;
        }
        .nav-dropdown button:hover { background: oklch(0.95 0.04 250); }
        .nav-dropdown button i { margin-right: 12px; width: 20px; }

        /* ===== WRAPPER GAMBAR ===== */
        .img-section {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            line-height: 0;
            background: var(--putih-base);
        }
        .img-section img { width: 100%; height: auto; display: block; }
        
        /* Border Spesifik */
        .header-img { border: 1px solid var(--border-hitam-tipis); } /* page1.png & profile1.png */
        .body-img   { border: 1px solid var(--border-kuning); }      /* profile2.png */
        .footer-img { border: 1px solid var(--border-krem); }        /* page3.png & profile3.png */

        /* ===== DIVIDER ===== */
        .divider-section {
            width: 100%;
            display: flex; flex-direction: column; align-items: center;
            gap: 2.5vh;
            margin: 4vh 0; 
        }
        .dashed-line {
            width: 70%; border-top: 2px dashed var(--border-kuning); opacity: 0.5;
        }
        .dashed-line.small { width: 50%; }
        .dashed-line.large { width: 85%; }

        /* ===== HALAMAN LAIN ===== */
        .halaman { 
            display: none; 
            padding: 20px 0; 
            text-align: center; 
        }
        .halaman.active { display: block; }
        
        .hero-other h2 { color: var(--biru-base); margin-bottom: 1rem; }
        .btn-spring {
            display: inline-block; margin-top: 20px; background: var(--krem-base);
            color: var(--putih-base); padding: 12px 32px; border-radius: 40px;
            text-decoration: none; font-weight: 800; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-spring:hover { transform: scale(1.05); }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container-website { padding: 10px 10px 0 10px; }
            .floating-header { top: 10px; right: 10px; }
            .hamburger { width: 44px; height: 44px; font-size: 1.2rem; }
            .divider-section { margin: 3vh 0; gap: 2vh; }
        }
    </style>
</head>
<body>

    <!-- ===== FLOATING HAMBURGER ===== -->
    <header class="floating-header">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <nav class="nav-dropdown" id="navDropdown">
            <button data-target="home"><i class="fas fa-home"></i> Home</button>
            <button data-target="profile"><i class="fas fa-user"></i> Profile</button>
            <button data-target="howtoplay"><i class="fas fa-gamepad"></i> Cara main</button>
        </nav>
    </header>

    <!-- ===== KONTAINER UTAMA ===== -->
    <main class="container-website">

        <!-- ===== HOME PAGE ===== -->
        <div id="home" class="home-wrapper">
            <!-- KHUSUS HOME: page1.png (Header) -->
            <div class="img-section header-img">
                <img src="page1.png" alt="Header Home ETNOSATEK" />
            </div>

            <div class="divider-section">
                <div class="dashed-line large"></div>
                <div class="dashed-line"></div>
                <div class="dashed-line small"></div>
                <div class="dashed-line"></div>
            </div>

            <!-- Body Home: profile2.png -->
            <div class="img-section body-img">
                <img src="profile2.png" alt="Body Solusi ETNOSATEK" />
            </div>

            <div class="divider-section">
                <div class="dashed-line small"></div>
                <div class="dashed-line"></div>
                <div class="dashed-line large"></div>
                <div class="dashed-line"></div>
            </div>

            <!-- Footer Global: page3.png -->
            <div class="img-section footer-img">
                <img src="page3.png" alt="Footer ETNOSATEK" />
            </div>
        </div>

        <!-- ===== PROFILE PAGE ===== -->
        <div id="profile" class="halaman hero-other">
            <h2>Profil Peneliti</h2>
            <p><strong>Nazwa Ananda Devina</strong><br>SMP Muhammadiyah 17 Ciputat<br>Dibimbing Ibu Octa<br>LKIP 2026</p>

            <!-- KHUSUS PROFILE: profile1.png, profile2.png, profile3.png -->
            <div style="margin-top: 30px; width: 100%; display: flex; flex-direction: column; gap: 4vh;">
                <div class="img-section header-img">
                    <img src="profile1.png" alt="Profile 1" />
                </div>
                
                <div class="img-section body-img">
                    <img src="profile2.png" alt="Profile 2" />
                </div>
                
                <div class="img-section footer-img">
                    <img src="profile3.png" alt="Profile 3" />
                </div>
            </div>

            <!-- Footer Global: page3.png -->
            <div style="margin-top: 30px; width: 100%;">
                <div class="img-section footer-img">
                    <img src="page3.png" alt="Footer ETNOSATEK" />
                </div>
            </div>
        </div>
        
        <!-- ===== CARA MAIN PAGE ===== -->
        <div id="howtoplay" class="halaman hero-other">
            <h2>Cara Main</h2>
            <p>Klik tombol di bawah untuk langsung memulai petualangan ETNOSATEK.</p>
            <a class="btn-spring" href="https://etnosatek-nazwa.vercel.app" target="_blank">Mulai Sekarang →</a>
            
            <!-- Footer Global: page3.png -->
            <div style="margin-top: 30px; width: 100%;">
                <div class="img-section footer-img">
                    <img src="page3.png" alt="Footer ETNOSATEK" />
                </div>
            </div>
        </div>

    </main>

    <script>
        const btn = document.getElementById('hamburgerBtn');
        const menu = document.getElementById('navDropdown');

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            menu.classList.toggle('open');
        });

        const menuButtons = document.querySelectorAll('.nav-dropdown button');
        const homeWrapper = document.getElementById('home');
        const halamanLain = document.querySelectorAll('.halaman');

        menuButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');

                if (targetId === 'home') {
                    homeWrapper.style.display = 'flex';
                    halamanLain.forEach(page => page.classList.remove('active'));
                } else {
                    homeWrapper.style.display = 'none';
                    halamanLain.forEach(page => page.classList.remove('active'));
                    document.getElementById(targetId).classList.add('active');
                }

                menu.classList.remove('open');
            });
        });

        document.addEventListener('click', (e) => {
            if (!btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.remove('open');
            }
        });
    </script>
</body>
</html>
