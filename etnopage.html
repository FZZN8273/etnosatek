<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETNOSATEK</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== OKLCH PALET ===== */
        :root {
            --biru-base: oklch(0.45 0.12 240);
            --krem-base: oklch(0.88 0.08 80);
            --putih-base: oklch(1 0 0);
            --border-hitam-tipis: oklch(0 0 0 / 0.2);
            --border-kuning: oklch(0.78 0.18 85);
            --border-krem: oklch(0.92 0.06 80);
            --cokelat-batik: oklch(0.35 0.12 25);
            --neon-oklch: oklch(0.75 0.25 290);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 16px;
            background-color: var(--biru-base);
            background-image: 
                radial-gradient(circle at 90% 10%, var(--krem-base) 0%, var(--krem-base) 25%, transparent 30%),
                radial-gradient(circle at 10% 90%, var(--putih-base) 0%, var(--putih-base) 15%, transparent 20%);
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        .container-website {
            width: 100%;
            max-width: 900px;
            padding: 20px 20px 0 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .floating-header {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }
        .hamburger {
            background: var(--putih-base);
            border: 1px solid oklch(0 0 0 / 0.1);
            box-shadow: 0 4px 12px oklch(0 0 0 / 0.08);
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: oklch(0.2 0.05 260);
            font-size: 1.4rem;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .hamburger:hover { transform: scale(1.1); }

        .nav-dropdown {
            position: absolute;
            top: 58px;
            right: 0;
            background: var(--putih-base);
            border-radius: 14px;
            padding: 10px 0;
            min-width: 160px;
            box-shadow: 0 8px 30px oklch(0 0 0 / 0.12);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.3s ease;
            border: 1px solid oklch(0.8 0.02 80);
        }
        .nav-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .nav-dropdown button {
            display: block; width: 100%; background: transparent; border: none;
            padding: 12px 20px; font-family: inherit; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; text-align: left; color: oklch(0.2 0.05 260);
            transition: background 0.2s;
        }
        .nav-dropdown button:hover { background: oklch(0.95 0.04 250); }
        .nav-dropdown button i { margin-right: 12px; width: 20px; }

        .home-wrapper { display: flex; flex-direction: column; }
        
        .img-section {
            width: 100%;
            border-radius: 90px;
            overflow: hidden;
            line-height: 0;
            background: var(--putih-base);
            box-shadow: 0 8px 30px oklch(0 0 0 / 0.08);
        }
        .img-section img { width: 100%; height: auto; display: block; }
        
        .header-img { border: 1px solid var(--border-hitam-tipis); }
        .body-img   { border: 1px solid var(--border-kuning); }
        .footer-img {
            border: 1px solid var(--border-krem);
            background: var(--cokelat-batik);
        }

        .profile-neon-border {
            border-radius: 90px;
            border: 2px solid transparent;
            box-shadow: 0 8px 30px oklch(0 0 0 / 0.08), 0 0 12px var(--neon-oklch), inset 0 0 12px var(--neon-oklch);
            background: var(--putih-base);
        }

        .divider-section {
            width: 100%;
            display: flex; flex-direction: column; align-items: center;
            gap: 2.5vh;
            margin: 4vh 0;
        }
        .dashed-line {
            width: 70%; border-top: 2px dashed var(--border-kuning); opacity: 0.5;
        }
        .dashed-line.small { width: 50%; }
        .dashed-line.large { width: 85%; }

        .halaman { display: none; padding: 20px 0; text-align: center; }
        .halaman.active { display: block; }
        
        .hero-other h2 { color: var(--biru-base); margin-bottom: 1rem; }
        .btn-spring {
            display: inline-block; margin-top: 20px; background: var(--krem-base);
            color: var(--putih-base); padding: 12px 32px; border-radius: 40px;
            text-decoration: none; font-weight: 800; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-spring:hover { transform: scale(1.05); }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container-website { padding: 10px 10px 0 10px; }
            .floating-header { top: 10px; right: 10px; }
            .hamburger { width: 44px; height: 44px; font-size: 1.2rem; }
            .divider-section { margin: 3vh 0; gap: 2vh; }
            .img-section { border-radius: 50px; }
            .profile-neon-border { border-radius: 50px; }
        }
    </style>
</head>
<body>

    <!-- ===== FLOATING HAMBURGER ===== -->
    <header class="floating-header">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <nav class="nav-dropdown" id="navDropdown">
            <button data-target="home"><i class="fas fa-home"></i> Home</button>
            <button data-target="profile"><i class="fas fa-user"></i> Profile</button>
            <button data-target="howtoplay"><i class="fas fa-gamepad"></i> Cara main</button>
        </nav>
    </header>

    <!-- ===== KONTAINER UTAMA ===== -->
    <main class="container-website">

        <!-- ===== WRAPPER HOME ===== -->
        <div id="home" class="home-wrapper">
            <div class="img-section header-img">
                <img src="page1.png" alt="Header ETNOSATEK" />
            </div>
            <div class="divider-section">
                <div class="dashed-line large"></div>
                <div class="dashed-line"></div>
                <div class="dashed-line small"></div>
                <div class="dashed-line"></div>
            </div>
            <div class="img-section body-img">
                <img src="page2.png" alt="Body ETNOSATEK" />
            </div>
            <div class="divider-section">
                <div class="dashed-line small"></div>
                <div class="dashed-line"></div>
                <div class="dashed-line large"></div>
                <div class="dashed-line"></div>
            </div>
            <div class="img-section footer-img">
                <img src="page3.png" alt="Footer ETNOSATEK" />
            </div>
        </div>

        <!-- ===== HALAMAN PROFILE ===== -->
        <div id="profile" class="halaman">
            <div style="width: 100%; display: flex; flex-direction: column; gap: 4vh;">
                <div class="img-section profile-neon-border">
                    <img src="profile1.png" alt="Profile 1" />
                </div>
                <div class="img-section profile-neon-border">
                    <img src="profile2.png" alt="Profile 2" />
                </div>
                <div class="img-section profile-neon-border">
                    <img src="profile3.png" alt="Profile 3" />
                </div>
            </div>
            <div style="margin-top: 40px; width: 100%;">
                <div class="img-section footer-img">
                    <img src="page3.png" alt="Footer ETNOSATEK" />
                </div>
            </div>
        </div>
        
        <!-- ===== HALAMAN CARA MAIN ===== -->
        <div id="howtoplay" class="halaman hero-other">
            <h2>Cara Main</h2>
            <a class="btn-spring" href="https://etnosatek-nazwa.vercel.app" target="_blank">Mulai Sekarang →</a>
            <div style="margin-top: 30px; width: 100%;">
                <div class="img-section footer-img">
                    <img src="page3.png" alt="Footer ETNOSATEK" />
                </div>
            </div>
        </div>

    </main>

    <!-- ============================================================
         CHATBOT (FIX TOTAL) – HTML dengan inline style agar aman
    ============================================================ -->
    <button id="ai-chat-btn"
            style="position:fixed; bottom:20px; right:20px; z-index:999999; width:60px; height:60px; border-radius:50%; background:#4a6fa5; border:4px solid white; font-size:28px; color:white; cursor:pointer; box-shadow:0 4px 20px rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; transition:0.2s;"
            onclick="toggleChat()"
            onmouseover="this.style.transform='scale(1.1)'"
            onmouseout="this.style.transform='scale(1)'">
        🤖
    </button>

    <div id="ai-chat-window"
         style="position:fixed; bottom:90px; right:20px; z-index:999998; width:340px; max-width:90vw; height:420px; background:#fff; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,0.3); display:none; flex-direction:column; overflow:hidden; border:1px solid #ddd;">
        <div id="ai-chat-header" style="background:#4a6fa5; color:white; padding:14px 16px; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
            <span>🤖 Asisten ETNOSATEK</span>
            <button onclick="toggleChat()" style="background:transparent; border:none; color:white; font-size:20px; cursor:pointer;">✕</button>
        </div>
        <div id="ai-chat-messages" style="flex:1; padding:12px; overflow-y:auto; background:#f9f9f9; display:flex; flex-direction:column; gap:8px;">
            <div class="msg-bot" style="align-self:flex-start; background:#eee; padding:10px 14px; border-radius:16px 16px 16px 0; max-width:85%; font-size:14px; color:#333; line-height:1.5;">
                Halo Kapten! Saya asisten ETNOSATEK. Silakan tanya apa saja tentang game, prasasti, GPS, atau literasi digital!
            </div>
        </div>
        <div id="ai-chat-input-area" style="padding:10px; border-top:1px solid #ddd; display:flex; gap:8px; background:#fff;">
            <input type="text" id="ai-chat-input" placeholder="Tulis pertanyaan..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:30px; outline:none;" onkeypress="if(event.key==='Enter') sendChatGemini()">
            <button id="ai-chat-send" onclick="sendChatGemini()" style="background:#4a6fa5; color:white; border:none; padding:8px 18px; border-radius:30px; cursor:pointer; font-weight:bold;">Kirim</button>
        </div>
    </div>

    <!-- ===== JAVASCRIPT EKSTERNAL ===== -->
    <script src="script.js"></script>

</body>
</html>
