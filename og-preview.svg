<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6fa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d4a6f;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="accentGradient" cx="90%" cy="10%">
      <stop offset="0%" style="stop-color:#e8d8b8;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#e8d8b8;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <circle cx="1080" cy="63" r="200" fill="url(#accentGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="550" r="150" fill="#e8d8b8" opacity="0.15"/>
  <rect x="50" y="150" width="100" height="100" fill="#4a9fd8" opacity="0.2" rx="10"/>
  <rect x="1050" y="400" width="120" height="120" fill="#e8b44f" opacity="0.2" rx="10"/>
  
  <!-- Main title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#ffffff">
    ETNOSATEK
  </text>
  
  <!-- Subtitle line -->
  <line x1="250" y1="250" x2="950" y2="250" stroke="#e8d8b8" stroke-width="3" opacity="0.6"/>
  
  <!-- Tagline -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="56" text-anchor="middle" fill="#e8d8b8">
    Game Edukasi Budaya & Teknologi
  </text>
  
  <!-- Sub-tagline -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="42" text-anchor="middle" fill="#d4c5a0">
    Jelajahi Prasasti, Sistem Biner & Literasi Digital
  </text>
  
  <!-- Keywords/Features -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#c9b48f">
    📜 Prasasti • 🔢 Biner • ⭐ Navigasi • 🛡️ Literasi Digital
  </text>
</svg>